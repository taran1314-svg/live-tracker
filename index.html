<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>लोकेशन खोजी - लाइव डैशबोर्ड</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; padding: 0; background: #0f172a; color: white; }
        .dashboard-header { background: #1e293b; padding: 10px; border-bottom: 3px solid #38bdf8; }
        .dash-title { font-size: 16px; font-weight: bold; color: #38bdf8; text-align: center; margin: 0 0 8px 0; }
        .info-group { display: flex; justify-content: space-between; gap: 5px; flex-wrap: wrap; }
        .info-box { background: #0f172a; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid #334155; flex: 1; text-align: center; }
        .control-bar { background: #334155; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .control-bar input { padding: 4px; width: 70px; text-align: center; border-radius: 4px; border: none; font-weight: bold; }
        .control-bar button { background: #38bdf8; color: #0f172a; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .alert-banner { padding: 8px; text-align: center; font-weight: bold; font-size: 13px; }
        .safe { background: #065f46; color: #4ade80; }
        .danger { background: #991b1b; color: #f87171; }
        #map { height: calc(100vh - 140px); width: 100%; }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <h2 class="dash-title">🛡️ लोकेशन खोजी - लाइव डैशबोर्ड</h2>
        <div class="info-group">
            <div class="info-box" id="latLonBox">📍 लोड हो रहा...</div>
            <div class="info-box" id="battBox">🔋 --%</div>
            <div class="info-box" id="spdBox">🚀 -- km/h</div>
            <div class="info-box" id="timeBox">⏱️ --</div>
        </div>
    </div>

    <div class="control-bar">
        <span>🎯 सुरक्षित दायरा (मीटर):</span>
        <!-- यहाँ हमने डिफ़ॉल्ट वैल्यू 1000 मीटर (1 किमी) कर दी है, पैरेंट्स इसे 2000 या अपनी मर्जी से कुछ भी लिख सकते हैं -->
        <input type="number" id="radiusInput" value="1000" step="100" min="100">
        <button id="updateRadiusBtn">अपडेट करें</button>
    </div>

    <div id="alertBox" class="alert-banner safe">✅ लाइव डेटा की प्रतीक्षा है...</div>
    <div id="map"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://location-khoji-default-rtdb.firebaseio.com/" }));
        
        const map = L.map('map').setView([28.896, 76.554], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // शुरुआत में 1000 मीटर (1 किमी) का दायरा सेट किया है
        let safeCircle = L.circle([28.896, 76.554], { radius: 1000, color: '#38bdf8', fillOpacity: 0.2, draggable: true }).addTo(map);
        const marker = L.marker([28.896, 76.554]).addTo(map);

        document.getElementById('updateRadiusBtn').onclick = () => {
            const val = parseInt(document.getElementById('radiusInput').value);
            if(val > 0) {
                safeCircle.setRadius(val); // पैरेंट्स जो भी मीटर डालेंगे (जैसे 2000), दायरा उतना बड़ा हो जाएगा
            }
        };

        onValue(ref(db, 'childData/location'), (snap) => {
            const data = snap.val();
            if (data) {
                marker.setLatLng([data.latitude, data.longitude]);
                document.getElementById('latLonBox').innerHTML = `📍 ${data.latitude.toFixed(3)}, ${data.longitude.toFixed(3)}`;
                document.getElementById('battBox').innerHTML = `🔋 ${data.battery}%`;
                document.getElementById('spdBox').innerHTML = `🚀 ${data.speed} km/h`;
                
                const dateObj = new Date(data.timestamp);
                document.getElementById('timeBox').innerHTML = `⏱️ ${dateObj.toLocaleTimeString()}`;

                const dist = map.distance([data.latitude, data.longitude], safeCircle.getLatLng());
                const alertDiv = document.getElementById('alertBox');
                if (dist > safeCircle.getRadius()) {
                    alertDiv.className = "alert-banner danger";
                    alertDiv.innerHTML = `⚠️ चेतावनी: बच्चा दायरे से बाहर है! (${Math.round(dist)}m)`;
                } else {
                    alertDiv.className = "alert-banner safe";
                    alertDiv.innerHTML = `✅ सुरक्षित (निर्धारित दायरे के अंदर)`;
                }
            }
        });
    </script>
</body>
</html>
